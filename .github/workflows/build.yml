name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify scanner
        shell: powershell
        run: .\tests\verify.ps1
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexSkillViewer-windows-x64
          path: dist/*
